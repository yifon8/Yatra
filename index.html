<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra - Your Travel Agent for India</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #5a5a5a 0%, #3a3a3a 100%);
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            gap: 30px;
            align-items: stretch;
            max-height: 90vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .banner {
            font-size: 28px;
            font-weight: bold;
            color: #d97531;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        .form-group select,
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input[type="number"]:focus,
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #d97531;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }

        .input-with-unit {
            position: relative;
            width: 100%;
        }

        .input-with-unit input {
            width: 100%;
            padding-right: 60px;
        }

        .input-with-unit .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-weight: 600;
            pointer-events: none;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .submit-button {
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .results-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 500px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .results-title {
            font-size: 28px;
            font-weight: bold;
            color: #d97531;
            margin-bottom: 19px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .download-button {
            position: absolute;
            right: 0;
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .download-button:active {
            transform: translateY(0);
        }

        .download-button img {
            width: 20px;
            height: 20px;
        }

        .results-content {
            display: flex;
            flex-direction: column;
            color: #666;
            font-size: 16px;
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            min-height: 0;
        }

        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .results-list li {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f4f0;
            border-radius: 8px;
            border-left: 4px solid #d97531;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            color: #333;
        }

        .results-list li:last-child {
            margin-bottom: 0;
        }

        .results-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #d97531, transparent);
            margin: 0;
            flex-shrink: 0;
        }

        .results-buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-top: 19px;
            margin-bottom: 0px;
            gap: 20px;
        }

        .restart-button, .more-button {
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            height: 44px;
        }

        .restart-button:hover, .more-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .restart-button:active, .more-button:active {
            transform: translateY(0);
        }

        .more-button {
            margin-left: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Form Container -->
        <div class="container">
            <div class="banner">Yatra, your family's Travel Agent for India</div>

            <div class="form-grid">
                <!-- Row 1, Column 1: Dropdown for destination types -->
                <div class="form-group">
                    <label for="destination">Destination Type</label>
                    <select id="destination" name="destination" required>
                        <option value="">Select a destination</option>
                        <option value="beach">Beach & Coastal</option>
                        <option value="mountain">Mountain & Hill Stations</option>
                        <option value="heritage">Heritage & Cultural</option>
                        <option value="wildlife">Wildlife & Nature</option>
                    </select>
                </div>

                <!-- Row 1, Column 2: City input -->
                <div class="form-group">
                    <label for="city">In or Near City (Optional)</label>
                    <input type="text" id="city" name="city" maxlength="30" placeholder="e.g., Delhi, Mumbai">
                </div>

                <!-- Row 2, Column 1: Hours input -->
                <div class="form-group">
                    <label for="hours">Visit Duration (Optional)</label>
                    <div class="input-with-unit">
                        <input type="number" id="hours" name="hours" step="0.01" min="0.01" placeholder="e.g., 0.5, 1.5, 8.25">
                        <span class="unit">hours</span>
                    </div>
                </div>

                <!-- Row 2, Column 2: Budget input -->
                <div class="form-group">
                    <label for="budget">Budget (Optional)</label>
                    <div class="input-with-unit">
                        <input type="number" id="budget" name="budget" min="0" placeholder="Enter amount">
                        <span class="unit">Rupees</span>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="button-container">
                <button type="button" class="submit-button" id="submitBtn">Help me, Yatra!</button>
            </div>
        </div>

        <!-- Results Container -->
        <div class="results-container" id="resultsContainer">
            <div class="results-title">
                <span>Yatra says:</span>
                <button type="button" class="download-button" id="downloadBtn">
                    <img src="Yatra_download.svg" alt="Download">
                </button>
            </div>
            <div class="results-divider"></div>
            <div class="results-content" id="resultsContent">
                <p>Your travel recommendations will appear here...</p>
            </div>
            <div class="results-divider"></div>
            <div class="results-buttons-container">
                <button type="button" class="restart-button" id="restartBtn">Restart</button>
                <button type="button" class="more-button" id="moreBtn">More</button>
            </div>
        </div>
    </div>

    <script>
        // Get form elements
        const destinationSelect = document.getElementById('destination');
        const cityInput = document.getElementById('city');
        const hoursInput = document.getElementById('hours');
        const budgetInput = document.getElementById('budget');
        const submitBtn = document.getElementById('submitBtn');
        const restartBtn = document.getElementById('restartBtn');
        const moreBtn = document.getElementById('moreBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultsContent = document.getElementById('resultsContent');

        // Track current state
        let hasMoreResults = false;
        let isEndOfResults = false;
        let allDestinations = [];

        // Function to get form data
        function getFormData() {
            // Get destination type from dropdown
            const destinationType = destinationSelect.value;

            // Get city from city input (string or null if empty)
            const city = cityInput.value ? cityInput.value.trim() : null;

            // Get duration from hours input (decimal value or null if empty)
            const duration = hoursInput.value ? parseFloat(hoursInput.value) : null;

            // Get budget from budget input (positive integer or null if empty)
            const budget = budgetInput.value ? parseInt(budgetInput.value) : null;

            return {
                destinationType,
                city,
                duration,
                budget
            };
        }

        // Function to validate form data
        function validateFormData(data) {
            const errors = [];

            if (!data.destinationType) {
                errors.push('Please select a destination type');
            }

            // Duration is optional, but if provided, must be > 0
            if (data.duration !== null && data.duration <= 0) {
                errors.push('Visit duration must be greater than 0 hours (e.g., 0.5, 1.5, 8.25)');
            }

            // Budget is optional, but if provided, must be >= 0 (0 allowed for free destinations)
            if (data.budget !== null && data.budget < 0) {
                errors.push('Budget cannot be negative');
            }

            return errors;
        }

        // Function to format a single destination
        function formatDestination(dest) {
            const name = dest.name || dest.place || 'Unknown Destination';
            const rating = dest.google_review_rating || dest.rating || 'N/A';
            const type = dest.type || '';
            const city = dest.city || '';
            const state = dest.state || '';
            const description = dest.description || '';
            const time = dest.time_needed_to_visit_in_hrs || '';
            const fee = dest.entrance_fee_in_inr || '';

            let html = `<strong>${name}</strong>`;

            if (rating !== 'N/A' && rating !== '') {
                html += ` <span style="color: #d97531;">★ ${rating}/5</span>`;
            }

            html += '<br>';

            if (type) {
                html += `<em>Type:</em> ${type}<br>`;
            }

            if (city || state) {
                html += `<em>Location:</em> ${city}${city && state ? ', ' : ''}${state}<br>`;
            }

            if (time && time !== '') {
                html += `<em>Time needed:</em> ${time} hours<br>`;
            }

            if (description && description !== '') {
                html += `<br>${description}<br>`;
            }

            // Always show Entry Fee Value field
            html += `<em>Entry Fee Value:</em> `;
            if (fee === 0 || fee === '0') {
                html += 'Free';
            } else if (fee && fee !== '') {
                html += `₹${fee}`;
            } else {
                html += 'Information not available';
            }

            return html;
        }

        // Function to display destinations
        function displayDestinations(destinations) {
            if (!destinations || destinations.length === 0) {
                resultsContent.innerHTML = '<p>No destinations found matching your criteria.</p>';
                downloadBtn.style.display = 'none';
                return;
            }

            // Update the list of all destinations (append new ones from "More" button)
            allDestinations = destinations;

            const listItems = destinations.map(dest => {
                return `<li>${formatDestination(dest)}</li>`;
            }).join('');

            resultsContent.innerHTML = `
                <ul class="results-list">
                    ${listItems}
                </ul>
            `;

            // Show download button when there are results
            downloadBtn.style.display = 'flex';
        }

        // Function to send request to backend
        async function submitForm() {
            const formData = getFormData();

            // Validate form data
            const errors = validateFormData(formData);
            if (errors.length > 0) {
                resultsContent.innerHTML = `
                    <div style="color: #d97531; text-align: left;">
                        <strong>Please fix the following errors:</strong>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            ${errors.map(err => `<li>${err}</li>`).join('')}
                        </ul>
                    </div>
                `;
                return;
            }

            // Show loading state
            resultsContent.innerHTML = '<p>🔍 Searching for the best destinations for you...</p>';
            submitBtn.disabled = true;

            try {
                // Send POST request to backend API
                const response = await fetch('/api/suggest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData),
                    credentials: 'include'
                });

                // Parse the JSON response regardless of status
                const result = await response.json();

                // Handle different response scenarios
                if (response.ok && result.success) {
                    // Check if this is the end of results (single batch case)
                    if (result.end_of_results) {
                        // Display destinations first
                        if (result.destinations && result.destinations.length > 0) {
                            displayDestinations(result.destinations);

                            // Append end of results message below the destinations
                            resultsContent.innerHTML += `
                                <p style="color: #d97531; text-align: center; font-weight: 600; margin-top: 20px; padding-top: 20px; border-top: 2px solid rgba(217, 117, 49, 0.2);">
                                    ${result.message}
                                </p>
                            `;
                        }

                        moreBtn.style.display = 'none';
                        isEndOfResults = true;
                        hasMoreResults = false;
                    } else {
                        // Success case - display destinations
                        displayDestinations(result.destinations);
                        hasMoreResults = result.has_more;
                        isEndOfResults = false;

                        // Show More button if there are more results available
                        if (hasMoreResults) {
                            moreBtn.style.display = 'block';
                        } else {
                            moreBtn.style.display = 'none';
                        }
                    }
                } else if (result.cancelled && result.message) {
                    // Session was restarted - show informational message without error icon
                    resultsContent.innerHTML = `
                        <p style="color: #666; text-align: center; font-weight: 600;">
                            ${result.message}
                        </p>
                    `;
                    moreBtn.style.display = 'none';
                } else if (result.error) {
                    // Server returned a specific error message (400 or other error)
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ ${result.error}
                        </p>
                    `;
                    moreBtn.style.display = 'none';
                } else {
                    // Unexpected error format
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ An unexpected error occurred. Server returned status: ${response.status}
                        </p>
                    `;
                    moreBtn.style.display = 'none';
                }

            } catch (error) {
                console.error('Error:', error);
                // Network error or JSON parsing error
                resultsContent.innerHTML = `
                    <p style="color: #d97531;">
                        ❌ Failed to get recommendations. Please make sure the server is running.
                        <br><br>
                        Error: ${error.message}
                    </p>
                `;
                moreBtn.style.display = 'none';
            } finally {
                submitBtn.disabled = false;
            }
        }

        // Function to get more destinations
        async function getMoreDestinations() {
            // Show loading state
            const currentContent = resultsContent.innerHTML;
            moreBtn.disabled = true;

            try {
                const response = await fetch('/api/more', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    if (result.end_of_results) {
                        // If we have destinations, display them first
                        if (result.destinations && result.destinations.length > 0) {
                            displayDestinations(result.destinations);

                            // Append end of results message below the destinations
                            resultsContent.innerHTML += `
                                <p style="color: #d97531; text-align: center; font-weight: 600; margin-top: 20px; padding-top: 20px; border-top: 2px solid rgba(217, 117, 49, 0.2);">
                                    ${result.message}
                                </p>
                            `;
                        } else {
                            // No destinations, just show the message
                            resultsContent.innerHTML = `
                                <p style="color: #d97531; text-align: center; font-weight: 600;">
                                    ${result.message}
                                </p>
                            `;
                        }

                        moreBtn.style.display = 'none';
                        isEndOfResults = true;
                    } else {
                        // Display the new destinations
                        displayDestinations(result.destinations);
                        hasMoreResults = result.has_more;

                        // Show More button if there are more results available
                        if (hasMoreResults) {
                            moreBtn.style.display = 'block';
                        } else {
                            moreBtn.style.display = 'none';
                        }
                    }
                } else if (result.cancelled && result.message) {
                    // Session was restarted - show informational message without error icon
                    resultsContent.innerHTML = `
                        <p style="color: #666; text-align: center; font-weight: 600;">
                            ${result.message}
                        </p>
                    `;
                    moreBtn.style.display = 'none';
                } else if (result.error) {
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ ${result.error}
                        </p>
                    `;
                    moreBtn.style.display = 'none';
                }

            } catch (error) {
                console.error('Error:', error);
                resultsContent.innerHTML = currentContent;
                alert('Failed to load more destinations. Please try again.');
            } finally {
                moreBtn.disabled = false;
            }
        }

        // Function to restart search - clear form, results, and backend cache
        async function restartSearch() {
            try {
                // Call backend to clear cache and reset session
                const response = await fetch('/api/restart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'  // Include session cookie
                });

                const data = await response.json();

                if (!data.success) {
                    console.error('Backend restart failed:', data.error);
                    // Continue with frontend cleanup even if backend fails
                }

                console.log('Backend reset:', data.message || 'Success');
            } catch (error) {
                console.error('Error calling restart endpoint:', error);
                // Continue with frontend cleanup even if backend fails
            }

            // Reset form fields
            destinationSelect.value = '';
            cityInput.value = '';
            hoursInput.value = '';
            budgetInput.value = '';

            // Reset results content
            resultsContent.innerHTML = '<p>Your travel recommendations will appear here...</p>';

            // Reset state
            hasMoreResults = false;
            isEndOfResults = false;
            allDestinations = [];

            // Hide More and Download buttons
            moreBtn.style.display = 'none';
            downloadBtn.style.display = 'none';
        }

        // Function to generate family-friendly reason based on destination type and info
        function getFamilyFriendlyReason(dest) {
            const type = (dest.type || '').toLowerCase();
            const name = dest.name || 'this destination';

            // Generate context-aware family-friendly reasons
            if (type.includes('beach') || type.includes('coastal')) {
                return `Perfect for building sandcastles and enjoying calm waters with children.`;
            } else if (type.includes('fort') || type.includes('palace') || type.includes('historical')) {
                return `An educational journey through history that captivates young minds with stories of kings and queens.`;
            } else if (type.includes('temple') || type.includes('religious')) {
                return `A peaceful and culturally enriching experience suitable for families seeking spiritual connection.`;
            } else if (type.includes('park') || type.includes('garden') || type.includes('nature')) {
                return `Offers wide open spaces for children to play and explore nature safely.`;
            } else if (type.includes('museum') || type.includes('gallery')) {
                return `Interactive exhibits and educational displays engage children while teaching them about art and history.`;
            } else if (type.includes('wildlife') || type.includes('zoo') || type.includes('safari')) {
                return `Exciting animal encounters create unforgettable memories for the whole family.`;
            } else if (type.includes('lake') || type.includes('water')) {
                return `Serene water activities and boat rides provide safe entertainment for all ages.`;
            } else if (type.includes('hill station') || type.includes('mountain')) {
                return `Cool climate and scenic views offer a refreshing escape with family-friendly hiking trails.`;
            } else if (type.includes('monument') || type.includes('memorial')) {
                return `Impressive architecture and historical significance provide educational value for curious young minds.`;
            } else if (type.includes('amusement') || type.includes('theme park')) {
                return `Thrilling rides and attractions designed specifically for family fun and bonding.`;
            } else {
                // Default reason
                return `A well-maintained destination with facilities suitable for families with children of all ages.`;
            }
        }

        // Function to download PDF with all destinations
        async function downloadPDF() {
            try {
                downloadBtn.disabled = true;
                downloadBtn.innerHTML = '<img src="Yatra_download.svg" alt="Download"> Fetching all results...';

                // Fetch all destinations from the backend
                const response = await fetch('/api/all-destinations', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    alert(result.error || 'Failed to fetch destinations. Please try again.');
                    downloadBtn.innerHTML = '<img src="Yatra_download.svg" alt="Download">';
                    downloadBtn.disabled = false;
                    return;
                }

                const destinationsToExport = result.destinations;

                if (!destinationsToExport || destinationsToExport.length === 0) {
                    alert('No destinations to download. Please search for destinations first.');
                    downloadBtn.innerHTML = '<img src="Yatra_download.svg" alt="Download">';
                    downloadBtn.disabled = false;
                    return;
                }

                downloadBtn.innerHTML = '<img src="Yatra_download.svg" alt="Download"> Generating PDF...';

                // Initialize jsPDF
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();

                // Set margins to 0.5 inch (12.7mm)
                const margin = 12.7;
                const contentWidth = pageWidth - (2 * margin);
                const bottomMargin = 15; // Extra space for footer
                let yPosition = margin;

                // Title
                doc.setFontSize(20);
                doc.setTextColor(217, 117, 49); // Orange color
                doc.text('Yatra - Family-Friendly Destinations', pageWidth / 2, yPosition, { align: 'center' });
                yPosition += 15;

                // Helper function to calculate height needed for a destination block
                function calculateDestinationHeight(dest, index) {
                    let height = 0;

                    // Name and rating
                    const name = dest.name || dest.place || 'Unknown Destination';
                    const nameLines = doc.splitTextToSize(`${index + 1}. ${name}`, contentWidth);
                    height += 7; // Name line height

                    // Type
                    const type = dest.type || '';
                    if (type) {
                        const typeLines = doc.splitTextToSize(`Type: ${type}`, contentWidth);
                        height += typeLines.length * 5;
                    }

                    // Location
                    const city = dest.city || '';
                    const state = dest.state || '';
                    if (city || state) {
                        const locationLines = doc.splitTextToSize(`Location: ${city}${city && state ? ', ' : ''}${state}`, contentWidth);
                        height += locationLines.length * 5;
                    }

                    // Time needed
                    const time = dest.time_needed_to_visit_in_hrs || '';
                    if (time && time !== '') {
                        height += 5;
                    }

                    // Entry fee
                    height += 5;

                    // Description
                    const description = dest.description || '';
                    if (description && description !== '') {
                        height += 2;
                        const descLines = doc.splitTextToSize(description, contentWidth);
                        height += descLines.length * 4;
                    }

                    // Family-friendly reason
                    height += 3;
                    const familyReason = getFamilyFriendlyReason(dest);
                    const reasonLines = doc.splitTextToSize(`✓ Family-Friendly: ${familyReason}`, contentWidth);
                    height += reasonLines.length * 4;

                    // Separator and spacing
                    height += 16; // 8 for spacing before separator + 8 after

                    return height;
                }

                // Process each destination
                for (let i = 0; i < destinationsToExport.length; i++) {
                    const dest = destinationsToExport[i];

                    // Calculate height needed for this destination
                    const destinationHeight = calculateDestinationHeight(dest, i);

                    // Check if destination fits on current page
                    if (yPosition + destinationHeight > pageHeight - bottomMargin) {
                        // Start new page
                        doc.addPage();
                        yPosition = margin;
                    }

                    // Destination name and rating
                    doc.setFontSize(14);
                    doc.setTextColor(217, 117, 49);
                    const name = dest.name || dest.place || 'Unknown Destination';
                    const rating = dest.google_review_rating || dest.rating || 'N/A';

                    let nameText = `${i + 1}. ${name}`;
                    if (rating !== 'N/A' && rating !== '') {
                        nameText += ` ★ ${rating}/5`;
                    }

                    const nameLines = doc.splitTextToSize(nameText, contentWidth);
                    doc.text(nameLines, margin, yPosition, { maxWidth: contentWidth });
                    yPosition += 7;

                    // Details
                    doc.setFontSize(10);
                    doc.setTextColor(51, 51, 51);

                    const type = dest.type || '';
                    const city = dest.city || '';
                    const state = dest.state || '';
                    const time = dest.time_needed_to_visit_in_hrs || '';
                    const fee = dest.entrance_fee_in_inr || '';
                    const description = dest.description || '';

                    if (type) {
                        const typeLines = doc.splitTextToSize(`Type: ${type}`, contentWidth);
                        doc.text(typeLines, margin, yPosition, { maxWidth: contentWidth });
                        yPosition += typeLines.length * 5;
                    }

                    if (city || state) {
                        const locationLines = doc.splitTextToSize(`Location: ${city}${city && state ? ', ' : ''}${state}`, contentWidth);
                        doc.text(locationLines, margin, yPosition, { maxWidth: contentWidth });
                        yPosition += locationLines.length * 5;
                    }

                    if (time && time !== '') {
                        doc.text(`Time needed: ${time} hours`, margin, yPosition);
                        yPosition += 5;
                    }

                    // Entry fee
                    let feeText = 'Entry Fee: ';
                    if (fee === 0 || fee === '0') {
                        feeText += 'Free';
                    } else if (fee && fee !== '') {
                        feeText += `INR ${fee}`;
                    } else {
                        feeText += 'Information not available';
                    }
                    doc.text(feeText, margin, yPosition);
                    yPosition += 5;

                    // Description
                    if (description && description !== '') {
                        yPosition += 2;
                        doc.setFontSize(9);
                        const descLines = doc.splitTextToSize(description, contentWidth);
                        doc.text(descLines, margin, yPosition, { maxWidth: contentWidth });
                        yPosition += descLines.length * 4;
                    }

                    // Family-friendly reason
                    yPosition += 3;
                    doc.setFontSize(9);
                    doc.setTextColor(0, 100, 0); // Green color for family-friendly
                    const familyReason = getFamilyFriendlyReason(dest);
                    const reasonLines = doc.splitTextToSize(`✓ Family-Friendly: ${familyReason}`, contentWidth);
                    doc.text(reasonLines, margin, yPosition, { maxWidth: contentWidth });
                    yPosition += reasonLines.length * 4 + 8;

                    // Add a separator line
                    doc.setDrawColor(217, 117, 49);
                    doc.setLineWidth(0.5);
                    doc.line(margin, yPosition, pageWidth - margin, yPosition);
                    yPosition += 8;
                }

                // Footer on last page
                doc.setFontSize(8);
                doc.setTextColor(128, 128, 128);
                doc.text('Generated by Yatra - Your Family Travel Agent for India', pageWidth / 2, pageHeight - 10, { align: 'center' });

                // Save the PDF
                const timestamp = new Date().toISOString().split('T')[0];
                doc.save(`Yatra_Destinations_${timestamp}.pdf`);

                downloadBtn.innerHTML = '<img src="Yatra_download.svg" alt="Download">';
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Failed to generate PDF. Please try again.');
                downloadBtn.innerHTML = '<img src="Yatra_download.svg" alt="Download">';
            } finally {
                downloadBtn.disabled = false;
            }
        }

        // Event listeners
        submitBtn.addEventListener('click', submitForm);
        restartBtn.addEventListener('click', restartSearch);
        moreBtn.addEventListener('click', getMoreDestinations);
        downloadBtn.addEventListener('click', downloadPDF);

        // Allow Enter key to submit form
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitForm();
            }
        });

        // Log form data to console for debugging (can be removed in production)
        console.log('Form input handler initialized');
        console.log('Available functions:', {
            getFormData: 'Get current form values',
            validateFormData: 'Validate form inputs',
            submitForm: 'Submit form to backend API',
            getMoreDestinations: 'Get next batch of destinations'
        });
    </script>
</body>
</html>
