<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra - Your Travel Agent for India</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #5a5a5a 0%, #3a3a3a 100%);
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            gap: 30px;
            align-items: stretch;
            max-height: 90vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .banner {
            font-size: 28px;
            font-weight: bold;
            color: #d97531;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        .form-group select,
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: #d97531;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }

        .input-with-unit {
            position: relative;
            width: 100%;
        }

        .input-with-unit input {
            width: 100%;
            padding-right: 60px;
        }

        .input-with-unit .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-weight: 600;
            pointer-events: none;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .submit-button {
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .results-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .results-title {
            font-size: 28px;
            font-weight: bold;
            color: #d97531;
            margin-bottom: 56px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .results-content {
            display: flex;
            flex-direction: column;
            color: #666;
            font-size: 16px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
        }

        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .results-list li {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f4f0;
            border-radius: 8px;
            border-left: 4px solid #d97531;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            color: #333;
        }

        .results-list li:last-child {
            margin-bottom: 0;
        }

        .results-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #d97531, transparent);
            margin: 0;
        }

        .results-content + .results-divider {
            margin-bottom: 56px;
        }

        .retry-button {
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .retry-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Form Container -->
        <div class="container">
            <div class="banner">Yatra, your family's Travel Agent for India</div>

            <div class="form-grid">
                <!-- Row 1, Column 1: Dropdown for destination types -->
                <div class="form-group">
                    <label for="destination">Destination Type</label>
                    <select id="destination" name="destination" required>
                        <option value="">Select a destination</option>
                        <option value="beach">Beach & Coastal</option>
                        <option value="mountain">Mountain & Hill Stations</option>
                        <option value="heritage">Heritage & Cultural</option>
                        <option value="wildlife">Wildlife & Nature</option>
                    </select>
                </div>

                <!-- Row 2, Column 1: Hours input -->
                <div class="form-group">
                    <label for="hours">Visit Duration (Optional)</label>
                    <div class="input-with-unit">
                        <input type="number" id="hours" name="hours" step="0.01" min="0.01" placeholder="e.g., 0.5, 1.5, 8.25">
                        <span class="unit">hours</span>
                    </div>
                </div>

                <!-- Row 2, Column 2: Budget input -->
                <div class="form-group">
                    <label for="budget">Budget (Optional)</label>
                    <div class="input-with-unit">
                        <input type="number" id="budget" name="budget" min="0" placeholder="Enter amount">
                        <span class="unit">Rupees</span>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="button-container">
                <button type="button" class="submit-button" id="submitBtn">Help me, Yatra!</button>
            </div>
        </div>

        <!-- Results Container -->
        <div class="results-container" id="resultsContainer">
            <div class="results-title">Yatra says:</div>
            <div class="results-divider"></div>
            <div class="results-content" id="resultsContent">
                <p>Your travel recommendations will appear here...</p>
            </div>
            <div class="results-divider"></div>
            <button type="button" class="retry-button" id="retryBtn">More</button>
        </div>
    </div>

    <script>
        // Get form elements
        const destinationSelect = document.getElementById('destination');
        const hoursInput = document.getElementById('hours');
        const budgetInput = document.getElementById('budget');
        const submitBtn = document.getElementById('submitBtn');
        const retryBtn = document.getElementById('retryBtn');
        const resultsContent = document.getElementById('resultsContent');

        // Track current state
        let hasMoreResults = false;
        let isEndOfResults = false;

        // Function to get form data
        function getFormData() {
            // Get destination type from dropdown
            const destinationType = destinationSelect.value;

            // Get duration from hours input (decimal value or null if empty)
            const duration = hoursInput.value ? parseFloat(hoursInput.value) : null;

            // Get budget from budget input (positive integer or null if empty)
            const budget = budgetInput.value ? parseInt(budgetInput.value) : null;

            return {
                destinationType,
                duration,
                budget
            };
        }

        // Function to validate form data
        function validateFormData(data) {
            const errors = [];

            if (!data.destinationType) {
                errors.push('Please select a destination type');
            }

            // Duration is optional, but if provided, must be > 0
            if (data.duration !== null && data.duration <= 0) {
                errors.push('Visit duration must be greater than 0 hours (e.g., 0.5, 1.5, 8.25)');
            }

            // Budget is optional, but if provided, must be >= 0 (0 allowed for free destinations)
            if (data.budget !== null && data.budget < 0) {
                errors.push('Budget cannot be negative');
            }

            return errors;
        }

        // Function to format a single destination
        function formatDestination(dest) {
            const name = dest.name || dest.place || 'Unknown Destination';
            const rating = dest.google_review_rating || dest.rating || 'N/A';
            const type = dest.type || '';
            const city = dest.city || '';
            const state = dest.state || '';
            const description = dest.description || '';
            const time = dest.time_needed_to_visit_in_hrs || '';
            const fee = dest.entrance_fee_in_inr || '';

            let html = `<strong>${name}</strong>`;

            if (rating !== 'N/A' && rating !== '') {
                html += ` <span style="color: #d97531;">★ ${rating}/5</span>`;
            }

            html += '<br>';

            if (type) {
                html += `<em>Type:</em> ${type}<br>`;
            }

            if (city || state) {
                html += `<em>Location:</em> ${city}${city && state ? ', ' : ''}${state}<br>`;
            }

            if (time && time !== '') {
                html += `<em>Time needed:</em> ${time} hours<br>`;
            }

            if (fee && fee !== '') {
                html += `<em>Entry fee:</em> ₹${fee}<br>`;
            }

            if (description && description !== '') {
                html += `<br>${description}`;
            }

            return html;
        }

        // Function to display destinations
        function displayDestinations(destinations) {
            if (!destinations || destinations.length === 0) {
                resultsContent.innerHTML = '<p>No destinations found matching your criteria.</p>';
                return;
            }

            const listItems = destinations.map(dest => {
                return `<li>${formatDestination(dest)}</li>`;
            }).join('');

            resultsContent.innerHTML = `
                <ul class="results-list">
                    ${listItems}
                </ul>
            `;
        }

        // Function to send request to backend
        async function submitForm() {
            const formData = getFormData();

            // Validate form data
            const errors = validateFormData(formData);
            if (errors.length > 0) {
                resultsContent.innerHTML = `
                    <div style="color: #d97531; text-align: left;">
                        <strong>Please fix the following errors:</strong>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            ${errors.map(err => `<li>${err}</li>`).join('')}
                        </ul>
                    </div>
                `;
                return;
            }

            // Show loading state
            resultsContent.innerHTML = '<p>🔍 Searching for the best destinations for you...</p>';
            submitBtn.disabled = true;
            retryBtn.textContent = 'More';
            retryBtn.style.display = 'block';

            try {
                // Send POST request to backend API
                const response = await fetch('/api/suggest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData),
                    credentials: 'include'
                });

                // Parse the JSON response regardless of status
                const result = await response.json();

                // Handle different response scenarios
                if (response.ok && result.success) {
                    // Success case - display destinations
                    displayDestinations(result.destinations);
                    hasMoreResults = result.has_more;
                    isEndOfResults = false;

                    // Show or hide More button based on whether there are more results
                    if (!hasMoreResults) {
                        retryBtn.style.display = 'none';
                    }
                } else if (result.error) {
                    // Server returned a specific error message (400 or other error)
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ ${result.error}
                        </p>
                    `;
                    retryBtn.style.display = 'none';
                } else {
                    // Unexpected error format
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ An unexpected error occurred. Server returned status: ${response.status}
                        </p>
                    `;
                    retryBtn.style.display = 'none';
                }

            } catch (error) {
                console.error('Error:', error);
                // Network error or JSON parsing error
                resultsContent.innerHTML = `
                    <p style="color: #d97531;">
                        ❌ Failed to get recommendations. Please make sure the server is running.
                        <br><br>
                        Error: ${error.message}
                    </p>
                `;
                retryBtn.style.display = 'none';
            } finally {
                submitBtn.disabled = false;
            }
        }

        // Function to get more destinations
        async function getMoreDestinations() {
            // If we've reached the end, reset the search
            if (isEndOfResults) {
                // Reset form
                destinationSelect.value = '';
                hoursInput.value = '';
                budgetInput.value = '';
                resultsContent.innerHTML = '<p>Your travel recommendations will appear here...</p>';
                retryBtn.textContent = 'More';
                retryBtn.style.display = 'block';
                hasMoreResults = false;
                isEndOfResults = false;
                return;
            }

            // Show loading state
            const currentContent = resultsContent.innerHTML;
            retryBtn.disabled = true;

            try {
                const response = await fetch('/api/more', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    if (result.end_of_results) {
                        // Show end of results message
                        resultsContent.innerHTML = `
                            <p style="color: #d97531; text-align: center; font-weight: 600;">
                                ${result.message}
                            </p>
                        `;
                        retryBtn.textContent = 'Restart';
                        retryBtn.style.display = 'block';
                        isEndOfResults = true;

                        // Scroll the button into view so it's visible
                        setTimeout(() => {
                            retryBtn.scrollIntoView({ behavior: 'smooth', block: 'end' });
                        }, 100);
                    } else {
                        // Display the new destinations
                        displayDestinations(result.destinations);
                        hasMoreResults = result.has_more;

                        // Hide More button if no more results
                        if (!hasMoreResults) {
                            retryBtn.style.display = 'none';
                        }
                    }
                } else if (result.error) {
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ ${result.error}
                        </p>
                    `;
                    retryBtn.style.display = 'none';
                }

            } catch (error) {
                console.error('Error:', error);
                resultsContent.innerHTML = currentContent;
                alert('Failed to load more destinations. Please try again.');
            } finally {
                retryBtn.disabled = false;
            }
        }

        // Event listeners
        submitBtn.addEventListener('click', submitForm);
        retryBtn.addEventListener('click', getMoreDestinations);

        // Allow Enter key to submit form
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitForm();
            }
        });

        // Log form data to console for debugging (can be removed in production)
        console.log('Form input handler initialized');
        console.log('Available functions:', {
            getFormData: 'Get current form values',
            validateFormData: 'Validate form inputs',
            submitForm: 'Submit form to backend API',
            getMoreDestinations: 'Get next batch of destinations'
        });
    </script>
</body>
</html>
