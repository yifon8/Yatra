<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra - Your Travel Agent for India</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #9b59b6 0%, #6a1b9a 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        .banner {
            font-size: 32px;
            font-weight: bold;
            color: #6a1b9a;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        .form-group select,
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: #9b59b6;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }

        .input-with-unit {
            position: relative;
            width: 100%;
        }

        .input-with-unit input {
            width: 100%;
            padding-right: 60px;
        }

        .input-with-unit .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-weight: 600;
            pointer-events: none;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .submit-button {
            background: linear-gradient(135deg, #9b59b6 0%, #6a1b9a 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(106, 27, 154, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(106, 27, 154, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .results-container {
            margin-top: 40px;
            padding: 30px;
            background: #f8f4fb;
            border-radius: 12px;
            border: 2px solid #9b59b6;
            display: none;
        }

        .results-container.show {
            display: block;
        }

        .results-title {
            font-size: 22px;
            font-weight: 600;
            color: #6a1b9a;
            margin-bottom: 20px;
            text-align: center;
        }

        .results-list {
            list-style: none;
            padding: 0;
        }

        .results-list li {
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #9b59b6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            color: #333;
        }

        .results-list li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">Yatra, your family's Travel Agent for India</div>

        <div class="form-grid">
            <!-- Row 1, Column 1: Dropdown for destination types -->
            <div class="form-group">
                <label for="destination">Destination Type</label>
                <select id="destination" name="destination" required>
                    <option value="">Select a destination</option>
                    <option value="beach">Beach & Coastal</option>
                    <option value="mountain">Mountain & Hill Stations</option>
                    <option value="heritage">Heritage & Cultural</option>
                    <option value="wildlife">Wildlife & Nature</option>
                </select>
            </div>

            <!-- Row 1, Column 2: Checkbox for small child -->
            <div class="form-group">
                <label for="smallChild">Traveling with Family</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="smallChild" name="smallChild">
                    <label for="smallChild">Small Child</label>
                </div>
            </div>

            <!-- Row 2, Column 1: Hours input -->
            <div class="form-group">
                <label for="hours">Travel Duration</label>
                <div class="input-with-unit">
                    <input type="number" id="hours" name="hours" min="1" placeholder="Enter hours">
                    <span class="unit">hours</span>
                </div>
            </div>

            <!-- Row 2, Column 2: Budget input -->
            <div class="form-group">
                <label for="budget">Budget</label>
                <div class="input-with-unit">
                    <input type="number" id="budget" name="budget" min="1" placeholder="Enter amount">
                    <span class="unit">Rupees</span>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="button-container">
            <button type="button" class="submit-button" id="submitBtn">Help me, Yatra!</button>
        </div>

        <!-- Results Container -->
        <div class="results-container" id="resultsContainer">
            <div class="results-title">Destination Suggestions</div>
            <ul class="results-list" id="resultsList">
                <!-- Results will be populated here -->
            </ul>
        </div>
    </div>
</body>
</html>
