<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra - Your Travel Agent for India</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #5a5a5a 0%, #3a3a3a 100%);
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            gap: 30px;
            align-items: stretch;
            max-height: 90vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .banner {
            font-size: 28px;
            font-weight: bold;
            color: #d97531;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        .form-group select,
        .form-group input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: #d97531;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }

        .input-with-unit {
            position: relative;
            width: 100%;
        }

        .input-with-unit input {
            width: 100%;
            padding-right: 60px;
        }

        .input-with-unit .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-weight: 600;
            pointer-events: none;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .submit-button {
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .results-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .results-title {
            font-size: 28px;
            font-weight: bold;
            color: #d97531;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .results-content {
            display: flex;
            flex-direction: column;
            color: #666;
            font-size: 16px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
        }

        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .results-list li {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f4f0;
            border-radius: 8px;
            border-left: 4px solid #d97531;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            color: #333;
        }

        .results-list li:last-child {
            margin-bottom: 0;
        }

        .results-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #d97531, transparent);
            margin: 20px 0;
        }

        .retry-button {
            background: linear-gradient(135deg, #d97531 0%, #b85a1f 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 117, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 117, 49, 0.4);
        }

        .retry-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Form Container -->
        <div class="container">
            <div class="banner">Yatra, your family's Travel Agent for India</div>

            <div class="form-grid">
                <!-- Row 1, Column 1: Dropdown for destination types -->
                <div class="form-group">
                    <label for="destination">Destination Type</label>
                    <select id="destination" name="destination" required>
                        <option value="">Select a destination</option>
                        <option value="beach">Beach & Coastal</option>
                        <option value="mountain">Mountain & Hill Stations</option>
                        <option value="heritage">Heritage & Cultural</option>
                        <option value="wildlife">Wildlife & Nature</option>
                    </select>
                </div>

                <!-- Row 2, Column 1: Hours input -->
                <div class="form-group">
                    <label for="hours">Visit Duration (Optional)</label>
                    <div class="input-with-unit">
                        <input type="number" id="hours" name="hours" step="0.01" min="0.01" placeholder="e.g., 0.5, 1.5, 8.25">
                        <span class="unit">hours</span>
                    </div>
                </div>

                <!-- Row 2, Column 2: Budget input -->
                <div class="form-group">
                    <label for="budget">Budget (Optional)</label>
                    <div class="input-with-unit">
                        <input type="number" id="budget" name="budget" min="0" placeholder="Enter amount">
                        <span class="unit">Rupees</span>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="button-container">
                <button type="button" class="submit-button" id="submitBtn">Help me, Yatra!</button>
            </div>
        </div>

        <!-- Results Container -->
        <div class="results-container" id="resultsContainer">
            <div class="results-title">Yatra says:</div>
            <div class="results-divider"></div>
            <div class="results-content" id="resultsContent">
                <p>Your travel recommendations will appear here...</p>
            </div>
            <div class="results-divider"></div>
            <button type="button" class="retry-button" id="retryBtn">Retry</button>
        </div>
    </div>

    <script>
        // Get form elements
        const destinationSelect = document.getElementById('destination');
        const hoursInput = document.getElementById('hours');
        const budgetInput = document.getElementById('budget');
        const submitBtn = document.getElementById('submitBtn');
        const retryBtn = document.getElementById('retryBtn');
        const resultsContent = document.getElementById('resultsContent');

        // Function to get form data
        function getFormData() {
            // Get destination type from dropdown
            const destinationType = destinationSelect.value;

            // Get duration from hours input (decimal value or null if empty)
            const duration = hoursInput.value ? parseFloat(hoursInput.value) : null;

            // Get budget from budget input (positive integer or null if empty)
            const budget = budgetInput.value ? parseInt(budgetInput.value) : null;

            return {
                destinationType,
                duration,
                budget
            };
        }

        // Function to validate form data
        function validateFormData(data) {
            const errors = [];

            if (!data.destinationType) {
                errors.push('Please select a destination type');
            }

            // Duration is optional, but if provided, must be > 0
            if (data.duration !== null && data.duration <= 0) {
                errors.push('Visit duration must be greater than 0 hours (e.g., 0.5, 1.5, 8.25)');
            }

            // Budget is optional, but if provided, must be >= 0 (0 allowed for free destinations)
            if (data.budget !== null && data.budget < 0) {
                errors.push('Budget cannot be negative');
            }

            return errors;
        }

        // Function to send request to backend
        async function submitForm() {
            const formData = getFormData();

            // Validate form data
            const errors = validateFormData(formData);
            if (errors.length > 0) {
                resultsContent.innerHTML = `
                    <div style="color: #d97531; text-align: left;">
                        <strong>Please fix the following errors:</strong>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            ${errors.map(err => `<li>${err}</li>`).join('')}
                        </ul>
                    </div>
                `;
                return;
            }

            // Show loading state
            resultsContent.innerHTML = '<p>🔍 Searching for the best destinations for you...</p>';
            submitBtn.disabled = true;

            try {
                // Send POST request to backend API
                const response = await fetch('/api/suggest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                // Parse the JSON response regardless of status
                const result = await response.json();

                // Handle different response scenarios
                if (response.ok && result.success) {
                    // Success case - display recommendations
                    displayRecommendations(result.recommendations);
                } else if (result.error) {
                    // Server returned a specific error message (400 or other error)
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ ${result.error}
                        </p>
                    `;
                } else {
                    // Unexpected error format
                    resultsContent.innerHTML = `
                        <p style="color: #d97531;">
                            ❌ An unexpected error occurred. Server returned status: ${response.status}
                        </p>
                    `;
                }

            } catch (error) {
                console.error('Error:', error);
                // Network error or JSON parsing error
                resultsContent.innerHTML = `
                    <p style="color: #d97531;">
                        ❌ Failed to get recommendations. Please make sure the server is running.
                        <br><br>
                        Error: ${error.message}
                    </p>
                `;
            } finally {
                submitBtn.disabled = false;
            }
        }

        // Function to display recommendations
        function displayRecommendations(recommendations) {
            // Convert text to HTML with proper formatting
            const formattedText = recommendations
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');

            resultsContent.innerHTML = `
                <div style="text-align: left; line-height: 1.6;">
                    ${formattedText}
                </div>
            `;
        }

        // Event listeners
        submitBtn.addEventListener('click', submitForm);

        retryBtn.addEventListener('click', () => {
            // Reset form
            destinationSelect.value = '';
            hoursInput.value = '';
            budgetInput.value = '';

            // Reset results
            resultsContent.innerHTML = '<p>Your travel recommendations will appear here...</p>';
        });

        // Allow Enter key to submit form
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitForm();
            }
        });

        // Log form data to console for debugging (can be removed in production)
        console.log('Form input handler initialized');
        console.log('Available functions:', {
            getFormData: 'Get current form values',
            validateFormData: 'Validate form inputs',
            submitForm: 'Submit form to backend API'
        });
    </script>
</body>
</html>
